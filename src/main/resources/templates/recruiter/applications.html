<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Applications</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div class="navbar">
    <div class="brand">AI Job Portal</div>
    <div class="nav-links">
        <a th:href="@{/recruiter/home}">My Jobs</a>
        <a th:href="@{/recruiter/jobs/new}">Post Job</a>
        <form th:action="@{/logout}" method="post"><button class="btn btn-light btn-sm">Logout</button></form>
    </div>
</div>
<div class="container">
    <div class="page-title">
        <h2>Applicants: <span th:text="${job.title}"></span></h2>
        <a class="btn btn-outline" th:href="@{/recruiter/home}">Back</a>
    </div>

    <div class="card">
        <form th:action="@{/recruiter/jobs/{id}/applications(id=${job.id})}" method="get"
              style="display:flex; gap:10px; align-items:center; flex-wrap:wrap">
            <label style="margin:0">Filter by skill:</label>
            <input type="text" name="skill" th:value="${skill}" placeholder="e.g. Java, React, SQL"
                   style="width:240px">
            <button class="btn btn-sm" type="submit">Filter</button>
            <a class="btn btn-outline btn-sm" th:if="${!skill.isEmpty()}"
               th:href="@{/recruiter/jobs/{id}/applications(id=${job.id})}">Clear</a>
        </form>
    </div>

    <div class="card">
        <div class="empty" th:if="${applications.isEmpty()}">No applicants found.</div>
        <table th:unless="${applications.isEmpty()}">
            <tr><th>Candidate</th><th>Skills</th><th>Match</th><th>Applied</th><th>Status</th><th>Update</th></tr>
            <tr th:each="a : ${applications}">
                <td><b th:text="${a.candidate.name}"></b><br>
                    <span style="color:#6b7280; font-size:12px" th:text="${a.candidate.email}"></span></td>
                <td th:with="sk=${skillsByApp.get(a.id)}">
                    <th:block th:if="${sk != null and !sk.isEmpty()}">
                        <span class="chip" th:each="s : ${#strings.arraySplit(sk, ',')}" th:text="${s}"></span>
                    </th:block>
                </td>
                <td>
                    <span class="badge"
                          th:if="${a.matchScore != null}"
                          th:classappend="${a.matchScore >= 70} ? 'badge-HIRED' : (${a.matchScore >= 40} ? 'badge-SHORTLISTED' : 'badge-REJECTED')"
                          th:text="${a.matchScore.intValue()} + '%'"></span>
                    <span th:if="${a.matchScore == null}">-</span>
                </td>
                <td th:text="${#temporals.format(a.appliedAt, 'dd MMM yyyy')}"></td>
                <td><span class="badge" th:classappend="'badge-' + ${a.status}" th:text="${a.status}"></span></td>
                <td>
                    <form th:action="@{/recruiter/applications/{id}/status(id=${a.id})}" method="post"
                          style="display:flex; gap:6px">
                        <select name="status" style="width:auto">
                            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                                    th:selected="${s == a.status}"></option>
                        </select>
                        <button class="btn btn-sm" type="submit">Save</button>
                    </form>
                </td>
            </tr>
        </table>
    </div>
</div>
</body>
</html>
