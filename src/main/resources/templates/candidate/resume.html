<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Resume</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div class="navbar">
    <div class="brand">AI Job Portal</div>
    <div class="nav-links">
        <a th:href="@{/candidate/home}">Jobs</a>
        <a th:href="@{/candidate/resume}">My Resume</a>
        <a th:href="@{/candidate/applications}">My Applications</a>
        <form th:action="@{/logout}" method="post"><button class="btn btn-light btn-sm">Logout</button></form>
    </div>
</div>
<div class="container">
    <div class="page-title"><h2>My Resume</h2></div>

    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

    <div class="card">
        <h3 style="margin-top:0">Upload resume (PDF)</h3>
        <form th:action="@{/candidate/resume/upload}" method="post" enctype="multipart/form-data">
            <div class="form-group"><input type="file" name="file" accept=".pdf" required></div>
            <button class="btn" type="submit">Upload &amp; Analyze</button>
        </form>
    </div>

    <div class="card" th:if="${resume != null}">
        <h3 style="margin-top:0">Latest resume</h3>
        <p><b>File:</b> <span th:text="${resume.fileName}"></span></p>
        <p><b>Uploaded:</b> <span th:text="${#temporals.format(resume.uploadedAt, 'dd MMM yyyy, HH:mm')}"></span></p>
        <p><b>Experience found:</b>
            <span th:text="${resume.experienceMonths != null ? resume.experienceMonths : resume.experienceYears * 12} + ' months'"></span></p>
        <p><b>Skills found:</b></p>
        <div th:if="${resume.skills != null and !resume.skills.isEmpty()}">
            <span class="chip" th:each="s : ${#strings.arraySplit(resume.skills, ',')}" th:text="${s}"></span>
        </div>
        <div class="empty" th:if="${resume.skills == null or resume.skills.isEmpty()}">
            No known skills detected in this resume.
        </div>
    </div>
</div>
</body>
</html>
