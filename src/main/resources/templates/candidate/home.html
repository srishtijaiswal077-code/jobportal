<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Candidate Dashboard</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div class="navbar">
    <div class="brand">AI Job Portal</div>
    <div class="nav-links">
        <a th:href="@{/candidate/home}">Jobs</a>
        <a th:href="@{/candidate/resume}">My Resume</a>
        <a th:href="@{/candidate/applications}">My Applications</a>
        <a th:href="@{/candidate/analyses}">Analysis History</a>
        <form th:action="@{/logout}" method="post"><button class="btn btn-light btn-sm">Logout</button></form>
    </div>
</div>
<div class="container">
    <div class="page-title"><h2>Open Jobs</h2></div>
    <div class="card">
        <div class="empty" th:if="${jobs.isEmpty()}">No jobs available right now.</div>
        <table th:unless="${jobs.isEmpty()}">
            <tr><th>Job</th><th>Skills</th><th>Experience</th><th>Location</th><th></th></tr>
            <tr th:each="j : ${jobs}">
                <td><b th:text="${j.title}"></b></td>
                <td><span class="chip" th:each="s : ${#strings.arraySplit(j.requiredSkills, ',')}"
                          th:text="${#strings.trim(s)}"></span></td>
                <td th:text="${j.minExperience} + '+ yrs'"></td>
                <td th:text="${j.location}"></td>
                <td style="white-space:nowrap">
                    <a class="btn btn-outline btn-sm" th:href="@{/candidate/jobs/{id}/analysis(id=${j.id})}">Check Match</a>
                    <span class="badge badge-HIRED" th:if="${appliedIds.contains(j.id)}">Applied</span>
                    <form th:unless="${appliedIds.contains(j.id)}" style="display:inline"
                          th:action="@{/candidate/jobs/{id}/apply(id=${j.id})}" method="post">
                        <button class="btn btn-sm" type="submit">Apply</button>
                    </form>
                </td>
            </tr>
        </table>
    </div>
</div>
</body>
</html>
