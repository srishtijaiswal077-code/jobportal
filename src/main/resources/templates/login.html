<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div class="auth-wrap"><div class="auth-card">
    <h2>Welcome back</h2>
    <div class="sub">Login to AI Job Portal</div>
    <div class="alert alert-error" th:if="${param.error}">Invalid email or password</div>
    <div class="alert alert-success" th:if="${param.registered}">Registered! Please login.</div>
    <div class="alert alert-info" th:if="${param.logout}">You have been logged out.</div>
    <form th:action="@{/login}" method="post">
        <div class="form-group"><label>Email</label><input type="email" name="username" required></div>
        <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
        <button class="btn" type="submit">Login</button>
    </form>
    <div class="switch">New here? <a th:href="@{/register}">Create account</a></div>
</div></div>
</body>
</html>
